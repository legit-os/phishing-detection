version: '3.8'

services:
  app:
    build: .
    ports:
      - "8502:8501"
    environment:
      - PYTHONUNBUFFERED=1

  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root

volumes:
  jenkins_home: